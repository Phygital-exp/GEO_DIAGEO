<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ubicación Diageo</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .button-location {
            background: #28a745;
            width: 100%;
            margin-top: 1rem;
        }

        .button-location:hover:not(:disabled) {
            background: #218838;
        }

        .hidden {
            display: none;
        }

        .user-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: left;
        }

        .user-info p {
            margin: 8px 0;
            color: #555;
        }

        .user-info strong {
            color: #333;
        }

        .status {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🗺️ Sistema de Ubicación Diageo</h2>

    <!-- STEP 1: Validar Usuario -->
    <div id="step-1">
        <div class="input-group">
            <input
                type="text"
                id="cedula"
                placeholder="Ingresa tu cédula"
                inputmode="numeric"
                onkeypress="if(event.key === 'Enter') validarUsuario()"
            >
            <button id="btn-validar" onclick="validarUsuario()">
                <i class="material-icons icon">check_circle</i>Validar
            </button>
        </div>
        <div id="mensaje"></div>
    </div>

    <!-- STEP 2: Usuario Validado -->
    <div id="step-2" class="hidden">
        <div class="user-info">
            <p><strong><i class="material-icons icon">badge</i>Cédula:</strong> <span id="cedula-display"></span></p>
            <p><strong><i class="material-icons icon">person_outline</i>Usuario:</strong> <span id="nombre-display">-</span></p>
            <p><strong><i class="material-icons icon">work_outline</i>Cargo:</strong> <span id="cargo-display">-</span></p>
            <p><strong><i class="material-icons icon">alt_route</i>Ruta:</strong> <span id="ruta-display">-</span></p>
            <p><strong><i class="material-icons icon">location_on</i>Ciudad:</strong> <span id="ciudad-display">-</span></p>
        </div>

        <p class="status success">
            <i class="material-icons icon">verified_user</i>✅ Usuario validado correctamente
        </p>

        <button class="button-location" onclick="enviarDatos()">
            <i class="material-icons icon">my_location</i>Compartir Ubicación
        </button>

        <button style="background: #6c757d; margin-top: 10px;" onclick="volverAlInicio()">
            <i class="material-icons icon">restart_alt</i>Validar otro usuario
        </button>

        <div id="mensaje-ubicacion"></div>
    </div>
</div>

<script>
    // ========== CONFIGURACIÓN ==========
    const PROXY_URL = "https://REEMPLAZAR-CON-URL-DE-RAILWAY.up.railway.app"; // URL del Proxy en Railway

    // ========== VARIABLES GLOBALES ==========
    let usuarioValidado = null;

    // ========== CARGAR DATOS AL INICIAR ==========
    window.onload = () => {
        document.getElementById('cedula').focus();
        console.log("Página cargada. Lista para validar usuarios.");
    };

    // ========== VALIDAR USUARIO ==========
    async function validarUsuario() {
        const cedula = document.getElementById('cedula').value.trim();
        const mensaje = document.getElementById('mensaje');

        if (!cedula) {
            mensaje.innerHTML = '<p class="status error"><i class="material-icons icon">error</i>Por favor ingresa tu cédula</p>';
            return;
        }

        // Mostrar loading
        mensaje.innerHTML = '<p class="status info"><span class="loading"></span>Validando cédula...</p>';

        try {
            // Llamar al Proxy para validar
            const response = await fetch(`${PROXY_URL}/api/validar?cedula=${encodeURIComponent(cedula)}`);

            if (!response.ok) {
                throw new Error(`Error: ${response.status}`);
            }

            const data = await response.json();

            if (data.existe && data.usuario) {
                // Usuario existe - guardar datos
                usuarioValidado = data.usuario;

                // Llenar información del usuario
                document.getElementById('cedula-display').textContent = usuarioValidado.CEDULA || cedula;
                document.getElementById('nombre-display').textContent = usuarioValidado.USUARIO || '-';
                document.getElementById('cargo-display').textContent = usuarioValidado.CARGO || '-';
                document.getElementById('ruta-display').textContent = usuarioValidado.RUTA || '-';
                document.getElementById('ciudad-display').textContent = usuarioValidado.CIUDAD || '-';

                // Cambiar a step-2
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
                mensaje.innerHTML = '';
            } else {
                // Usuario no existe
                mensaje.innerHTML = '<p class="status error"><i class="material-icons icon">block</i>⚠️ El usuario no existe. Revisa la cédula e intenta de nuevo.</p>';
                document.getElementById('cedula').value = '';
            }
        } catch (error) {
            console.error("Error al validar:", error);
            mensaje.innerHTML = '<p class="status error"><i class="material-icons icon">cloud_off</i>❌ Error al conectar con el servidor. Intenta más tarde.</p>';
        }
    }

    // ========== COMPARTIR UBICACIÓN ==========
    function enviarDatos() {
        const mensajeUbicacion = document.getElementById('mensaje-ubicacion');

        if (!navigator.geolocation) {
            mensajeUbicacion.innerHTML = '<p class="status error"><i class="material-icons icon">location_off</i>Geolocalización no está disponible en tu navegador.</p>';
            return;
        }

        mensajeUbicacion.innerHTML = '<p class="status info"><span class="loading"></span>Obteniendo tu ubicación...</p>';

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                // Enviar latitud y longitud por separado
                const payload = {
                    CEDULA: usuarioValidado.CEDULA || document.getElementById('cedula-display').textContent,
                    LATITUD: pos.coords.latitude,
                    LONGITUD: pos.coords.longitude
                };

                console.log("Enviando:", payload);

                try {
                    mensajeUbicacion.innerHTML = '<p class="status info"><span class="loading"></span>Enviando datos...</p>';

                    const res = await fetch(`${PROXY_URL}/api/enviar-ubicacion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        mensajeUbicacion.innerHTML = '<p class="status success"><i class="material-icons icon">check_circle</i>✅ Ubicación enviada correctamente!</p>';
                    } else {
                        throw new Error('Error en la respuesta del servidor');
                    }
                } catch (error) {
                    console.error("Error al enviar:", error);
                    mensajeUbicacion.innerHTML = '<p class="status error"><i class="material-icons icon">error</i>❌ Error al enviar los datos. Intenta de nuevo.</p>';
                }
            },
            (error) => {
                console.error("Error de geolocalización:", error);
                mensajeUbicacion.innerHTML = '<p class="status error"><i class="material-icons icon">location_off</i>❌ No se pudo obtener tu ubicación. Verifica los permisos.</p>';
            }
        );
    }

    // ========== VOLVER AL INICIO ==========
    function volverAlInicio() {
        document.getElementById('step-1').classList.remove('hidden');
        document.getElementById('step-2').classList.add('hidden');
        document.getElementById('cedula').value = '';
        document.getElementById('mensaje').innerHTML = '';
        document.getElementById('mensaje-ubicacion').innerHTML = '';
        document.getElementById('cedula').focus();
        usuarioValidado = null;
    }
</script>

</body>
</html>
